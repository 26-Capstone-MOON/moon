server:
  port: 8080

logging:
  level:
    com.moonapp.navigation.controller.TrackingWebSocketHandler: DEBUG

services:
  python:
    base-url: ${PYTHON_SERVICE_URL:http://localhost:8000}
  deviation:
    base-url: ${PYTHON_SERVICE_URL:http://localhost:8000}
  vision:
    enabled: ${VISION_ENABLED:false}
    max-payload-chars: ${VISION_MAX_PAYLOAD_CHARS:2200000}
